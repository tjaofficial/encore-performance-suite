{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Account Match Needed | Encore
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/encore_public_registration.css' %}"
    >
</head>
<body>
    <main class="public-shell narrow">
        <section class="public-registration-card">
            <span class="public-kicker">
                Account Verification
            </span>

            <h1>
                We found your login, but not a Family profile.
            </h1>

            <p>
                The studio will need to connect this Encore login to your
                Family record before self-service registration can finish.
            </p>

            <p>
                Your registration request is safe and has not been lost.
            </p>
        </section>
    </main>
</body>
</html>
