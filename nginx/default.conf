upstream encore_web {
    server web:8000;
}

server {
    listen 80;
    server_name encoreperformancesuite.com www.encoreperformancesuite.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name encoreperformancesuite.com www.encoreperformancesuite.com;

    ssl_certificate /etc/letsencrypt/live/encoreperformancesuite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/encoreperformancesuite.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    location /static/ {
        alias /vol/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /vol/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://encore_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
