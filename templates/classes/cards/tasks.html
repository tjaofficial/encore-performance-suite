<article class="class-dashboard-card task-card dashboard-task-card">
    <div class="dashboard-task-heading">
        <div>
            <span class="dashboard-task-kicker">Reminders / To-Do</span>
            <h2>Class Tasks</h2>
        </div>

        <a
            class="dashboard-task-add"
            href="{% url 'tasks:task_create' studio.slug %}?class={{ class_instance.id }}"
        >
            + Add Task
        </a>
    </div>

    <div class="dashboard-task-list">
        {% for task in class_tasks %}
            <div class="dashboard-task-row priority-{{ task.priority }}">
                <form
                    class="dashboard-task-complete"
                    method="post"
                    action="{% url 'tasks:task_toggle_complete' studio.slug task.id %}"
                >
                    {% csrf_token %}
                    <input
                        type="hidden"
                        name="next"
                        value="{{ request.get_full_path }}"
                    >

                    <button
                        type="submit"
                        class="dashboard-task-check"
                        aria-label="Complete {{ task.title }}"
                        title="Mark complete"
                    >
                        <span aria-hidden="true"></span>
                    </button>
                </form>

                <a
                    class="dashboard-task-row-link"
                    href="{% url 'tasks:task_detail' studio.slug task.id %}"
                    aria-label="Open task: {{ task.title }}"
                >
                    <span class="dashboard-task-copy">
                        <strong>{{ task.title }}</strong>
                    </span>

                    <span class="dashboard-task-end">
                        {% if task.due_date %}
                            <span class="dashboard-task-date">
                                {{ task.due_date|date:"M j" }}
                            </span>
                        {% endif %}
                        <span class="dashboard-task-arrow" aria-hidden="true">›</span>
                    </span>
                </a>
            </div>
        {% empty %}
            <div class="dashboard-task-empty">
                No open class tasks.
            </div>
        {% endfor %}
    </div>

    <a
        class="dashboard-task-footer"
        href="{% url 'tasks:task_list' studio.slug %}"
    >
        View All Tasks →
    </a>
</article>
