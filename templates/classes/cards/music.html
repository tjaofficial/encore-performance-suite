<article class="class-dashboard-card class-music-card">
  <div class="class-card-heading"><div><span class="card-kicker">Soundtrack Library</span><h2>Recent Music Uploads</h2></div><a href="{% url 'resources:music_manager' studio.slug %}?class={{ class_instance.id }}">View All</a></div>
  <div class="class-music-list" aria-label="Recent uploaded music">
    {% for music in class_music %}
      <a class="class-music-row class-music-row-link" href="{% if music.dance_id %}{% url 'performance:plan_detail' studio.slug music.dance_id %}{% elif performance_plan %}{% url 'performance:plan_detail' studio.slug performance_plan.id %}{% else %}{% url 'resources:music_manager' studio.slug %}?class={{ class_instance.id }}{% endif %}" aria-label="Open Dance Resources for {{ music.title }}">
        <span class="music-icon">♫</span><span class="class-music-info"><strong>{{ music.title }}</strong><small>{% if music.dance %}{{ music.dance.title }}{% elif music.artist %}{{ music.artist }}{% else %}Class music · select to open resources{% endif %}</small></span><span class="class-music-chevron">→</span>
      </a>
    {% empty %}<div class="class-card-empty media-empty">No music uploaded yet.</div>{% endfor %}
  </div>
</article>
