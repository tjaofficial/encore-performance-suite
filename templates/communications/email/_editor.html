<div class="encore-email-editor" data-email-editor>
    <div class="email-editor-toolbar" data-editor-toolbar>
        <div class="editor-tool-group">
            <button type="button" data-editor-command="bold" title="Bold"><strong>B</strong></button>
            <button type="button" data-editor-command="italic" title="Italic"><em>I</em></button>
            <button type="button" data-editor-command="underline" title="Underline"><u>U</u></button>
        </div>

        <div class="editor-tool-group">
            <select data-editor-block aria-label="Text style">
                <option value="p">Paragraph</option>
                <option value="h2">Heading</option>
                <option value="h3">Subheading</option>
            </select>
            <select data-editor-size aria-label="Font size">
                <option value="3">Normal</option>
                <option value="2">Small</option>
                <option value="4">Large</option>
                <option value="5">Extra Large</option>
            </select>
            <input type="color" value="#111827" data-editor-color title="Text color">
        </div>

        <div class="editor-tool-group">
            <button type="button" data-editor-command="justifyLeft" title="Align left">≡</button>
            <button type="button" data-editor-command="justifyCenter" title="Align center">≣</button>
            <button type="button" data-editor-command="justifyRight" title="Align right">≡</button>
            <button type="button" data-editor-command="insertUnorderedList">• List</button>
            <button type="button" data-editor-command="insertOrderedList">1. List</button>
        </div>

        <div class="editor-tool-group">
            <button type="button" data-editor-link>Link</button>
            <button type="button" data-editor-command="undo">↶</button>
            <button type="button" data-editor-command="redo">↷</button>
        </div>

        <button type="button" class="editor-mode-toggle" data-editor-mode-toggle>HTML</button>
    </div>

    <div class="email-editor-surface" contenteditable="true" role="textbox" aria-multiline="true" data-editor-surface></div>
    <textarea class="email-editor-html" data-editor-html hidden spellcheck="false"></textarea>
    <div class="email-editor-source" hidden>{{ field }}</div>
</div>

{% for error in field.errors %}
    <small class="field-error">{{ error }}</small>
{% endfor %}
