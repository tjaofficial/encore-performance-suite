services:

  db:

    image: postgres:16-alpine

    restart: unless-stopped

    environment:

      POSTGRES_DB: ${DB_NAME:-encore}

      POSTGRES_USER: ${DB_USER:-encore}

      POSTGRES_PASSWORD: ${DB_PASSWORD:-encore_local_password}

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-encore} -d ${DB_NAME:-encore}"
        ]

      interval: 5s
      timeout: 5s
      retries: 20

  web:

    build: .

    restart: unless-stopped

    env_file:
      - .env

    environment:

      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-encore}
      DB_USER: ${DB_USER:-encore}
      DB_PASSWORD: ${DB_PASSWORD:-encore_local_password}

    depends_on:

      db:
        condition: service_healthy

    volumes:

      - staticfiles:/app/staticfiles
      - mediafiles:/app/media

  nginx:

    image: nginx:1.27-alpine

    restart: unless-stopped

    depends_on:
      - web

    ports:
      - "8000:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/vol/static:ro
      - mediafiles:/vol/media:ro

volumes:

  postgres_data:
  staticfiles:
  mediafiles: