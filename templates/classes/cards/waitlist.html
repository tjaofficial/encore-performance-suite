<article class="class-dashboard-card waitlist-card">
    <div class="class-card-heading">
        <div>
            <span class="card-kicker">Enrollment</span>
            <h2>Waitlist</h2>
        </div>
        <strong>{{ waitlisted|length }}</strong>
    </div>

    <div class="waitlist-mini-list">
        {% for enrollment in waitlisted|slice:":5" %}
            <div>
                <strong>
                    {{ enrollment.student.first_name }}
                    {{ enrollment.student.last_name }}
                </strong>
                <span>{{ enrollment.enrolled_at|date:"M j" }}</span>
            </div>
        {% endfor %}
    </div>
</article>
